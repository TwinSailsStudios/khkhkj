<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavelength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #eee; font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; justify-content: center; }
#app { width: 100%; max-width: 520px; padding: 1.5rem; }
.screen { display: none; }
.screen.active { display: block; }
.title-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.game-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: #eee; }
.phase-badge { font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: #888; margin-bottom: 0.5rem; }
.clue-giver { font-size: 22px; font-weight: 500; color: #eee; margin-bottom: 1.5rem; }
.round-info { font-size: 12px; color: #555; text-align: right; }

.setup-card {
  background: #1c1c1c; border: 0.5px solid #333; border-radius: 12px;
  padding: 1.5rem; margin-bottom: 1rem;
}
.setup-label { font-size: 12px; color: #888; margin-bottom: 0.5rem; letter-spacing: 0.5px; }
.player-inputs { display: flex; flex-direction: column; gap: 0.5rem; }
.player-row { display: flex; gap: 0.5rem; align-items: center; }
.player-row input { flex: 1; }
.remove-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: 4px; line-height: 1; }
.remove-btn:hover { color: #e05; background: #2a0010; }
.add-player-btn { font-size: 13px; color: #4a9ef5; background: none; border: none; cursor: pointer; padding: 4px 0; margin-top: 0.5rem; font-family: inherit; }
.add-player-btn:hover { text-decoration: underline; }

input[type="text"] {
  background: #252525; border: 0.5px solid #444; border-radius: 8px;
  color: #eee; font-family: 'DM Sans', sans-serif; font-size: 15px;
  padding: 8px 12px; outline: none; transition: border-color 0.15s;
}
input[type="text"]:focus { border-color: #666; }
input[type="text"]::placeholder { color: #555; }

.start-btn, .give-clue-btn, .guess-btn, .next-round-btn {
  background: #eee; color: #111; border: none; border-radius: 8px;
  font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px;
  cursor: pointer; transition: opacity 0.15s;
}
.start-btn { width: 100%; padding: 14px; margin-top: 1rem; }
.start-btn:hover, .guess-btn:hover, .next-round-btn:hover { opacity: 0.85; }
.give-clue-btn { padding: 8px 16px; font-size: 18px; white-space: nowrap; }
.guess-btn { width: 100%; padding: 14px; margin-top: 1rem; }
.next-round-btn { width: 100%; padding: 14px; margin-bottom: 0.5rem; }

.new-game-btn {
  width: 100%; padding: 10px; background: none; color: #888;
  border: 0.5px solid #333; border-radius: 8px; font-family: inherit;
  font-size: 14px; cursor: pointer;
}
.new-game-btn:hover { background: #1c1c1c; }

.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 100;
  align-items: center; justify-content: center;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: #1c1c1c; border: 0.5px solid #444; border-radius: 16px;
  padding: 2rem 2rem 1.5rem; max-width: 340px; width: 90%; text-align: center;
}
.modal-eyebrow { font-size: 11px; letter-spacing: 1.5px; color: #666; text-transform: uppercase; margin-bottom: 0.75rem; }
.modal-name { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 3px; color: #eee; line-height: 1; margin-bottom: 0.5rem; }
.modal-sub { font-size: 14px; color: #666; margin-bottom: 1.75rem; }
.modal-btn {
  width: 100%; padding: 14px; background: #eee; color: #111; border: none;
  border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 20px;
  letter-spacing: 2px; cursor: pointer;
}
.modal-btn:hover { opacity: 0.85; }

.spectrum-card {
  background: #1c1c1c; border: 0.5px solid #333; border-radius: 12px;
  padding: 1.25rem; margin-bottom: 1rem;
}
.spectrum-poles { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
.pole { font-weight: 500; font-size: 18px; color: #eee; max-width: 44%; }
.pole.left { text-align: left; }
.pole.right { text-align: right; }
.pole-arrow { font-size: 14px; color: #555; }

.spectrum-bar {
  position: relative; height: 48px; border-radius: 24px;
  overflow: hidden;
  background: linear-gradient(to right, #4299e1, #9f7aea, #ed64a6, #f6ad55, #f56565);
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
.target-zone {
  position: absolute; top: 0; height: 100%;
  background: rgba(255,255,255,0.3);
  border-left: 2px solid rgba(255,255,255,0.7);
  border-right: 2px solid rgba(255,255,255,0.7);
  transition: opacity 0.4s;
}
.dial-container {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; margin-left: -18px; cursor: grab;
}
.dial-container:active { cursor: grabbing; }
.dial {
  width: 36px; height: 36px; border-radius: 50%; background: white;
  border: 2px solid rgba(0,0,0,0.3); box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; color: #333; pointer-events: none;
}
.hidden-target-hint { margin-top: 0.75rem; font-size: 13px; color: #555; text-align: center; }

.target-reveal {
  background: #1c1c1c; border: 0.5px solid #333; border-radius: 8px;
  padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px;
}
.target-text { font-size: 14px; color: #888; }
.target-pct { font-size: 20px; font-weight: 500; color: #eee; }

.clue-input-section { display: flex; gap: 0.5rem; margin-top: 1rem; }
.clue-input { flex: 1; font-size: 16px; }

.clue-display {
  background: #1c1c1c; border-radius: 8px; padding: 1rem 1.25rem;
  margin-bottom: 1rem; text-align: center;
}
.clue-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.clue-word { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; color: #eee; }

.score-visual {
  position: relative; height: 48px; border-radius: 24px;
  background: linear-gradient(to right, #4299e1, #9f7aea, #ed64a6, #f6ad55, #f56565);
  margin-bottom: 1.5rem;
}
.score-result { text-align: center; margin-bottom: 1.5rem; }
.score-pts { font-family: 'Bebas Neue', sans-serif; font-size: 56px; letter-spacing: 2px; color: #eee; line-height: 1; }
.score-pts-label { font-size: 14px; color: #888; }

.scoreboard {
  background: #1c1c1c; border: 0.5px solid #333; border-radius: 12px;
  overflow: hidden; margin-bottom: 1rem;
}
.scoreboard-header {
  display: flex; justify-content: space-between; padding: 0.6rem 1rem;
  font-size: 11px; color: #666; border-bottom: 0.5px solid #333; letter-spacing: 0.5px;
}
.scoreboard-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.65rem 1rem; border-bottom: 0.5px solid #222;
}
.scoreboard-row:last-child { border-bottom: none; }
.scoreboard-row.current { background: #252525; }
.player-name-sb { font-weight: 500; font-size: 15px; color: #eee; }
.player-score-sb { font-size: 18px; font-weight: 500; color: #eee; }
</style>
</head>
<body>
<div id="app">

  <div class="screen active" id="screen-setup">
    <div class="title-bar">
      <div class="game-title">〰 WAVELENGTH</div>
    </div>
    <div class="setup-card">
      <div class="setup-label">PLAYERS (2–6)</div>
      <div class="player-inputs" id="player-inputs">
        <div class="player-row"><input type="text" value="Player 1" /><button class="remove-btn" onclick="removePlayer(this)">×</button></div>
        <div class="player-row"><input type="text" value="Player 2" /><button class="remove-btn" onclick="removePlayer(this)">×</button></div>
      </div>
      <button class="add-player-btn" onclick="addPlayer()">+ Add player</button>
    </div>
    <button class="start-btn" onclick="startGame()">START GAME</button>
  </div>

  <div class="modal-overlay" id="psychic-modal">
    <div class="modal-box">
      <div class="modal-eyebrow">This round's psychic is</div>
      <div class="modal-name" id="modal-psychic-name"></div>
      <div class="modal-sub">Hand the laptop to them, then tap ready</div>
      <button class="modal-btn" onclick="closeModal()">I'M READY 👁</button>
    </div>
  </div>

  <div class="screen" id="screen-psychic">
    <div class="title-bar">
      <div class="game-title">〰 WAVELENGTH</div>
      <div class="round-info" id="round-info-psychic"></div>
    </div>
    <div class="phase-badge">PSYCHIC — GIVE A CLUE</div>
    <div class="clue-giver" id="psychic-name"></div>
    <div class="target-reveal">
      <div style="font-size:20px">🎯</div>
      <div>
        <div class="target-text">Your target is at</div>
        <div class="target-pct" id="target-pct-display"></div>
      </div>
    </div>
    <div class="spectrum-card">
      <div class="spectrum-poles">
        <div class="pole left" id="pole-left-psychic"></div>
        <div class="pole-arrow">←→</div>
        <div class="pole right" id="pole-right-psychic"></div>
      </div>
      <div class="spectrum-bar" id="psychic-bar">
        <div class="target-zone" id="target-zone-psychic"></div>
        <div class="dial-container" id="psychic-dial-container">
          <div class="dial">🎯</div>
        </div>
      </div>
    </div>
    <div class="clue-input-section">
      <input type="text" class="clue-input" id="clue-input" placeholder="One word clue..." />
      <button class="give-clue-btn" onclick="giveClue()">GIVE CLUE</button>
    </div>
  </div>

  <div class="screen" id="screen-guess">
    <div class="title-bar">
      <div class="game-title">〰 WAVELENGTH</div>
      <div class="round-info" id="round-info-guess"></div>
    </div>
    <div class="phase-badge" id="guess-phase-label">TEAM — PLACE YOUR GUESS</div>
    <div class="clue-display">
      <div class="clue-label">THE CLUE IS</div>
      <div class="clue-word" id="clue-word-display"></div>
    </div>
    <div class="spectrum-card">
      <div class="spectrum-poles">
        <div class="pole left" id="pole-left-guess"></div>
        <div class="pole-arrow">←→</div>
        <div class="pole right" id="pole-right-guess"></div>
      </div>
      <div class="spectrum-bar" id="guess-bar">
        <div class="target-zone" id="target-zone-hidden" style="opacity:0;"></div>
        <div class="dial-container" id="guess-dial-container" style="left:50%">
          <div class="dial">▲</div>
        </div>
      </div>
      <div class="hidden-target-hint">Drag the dial to place your guess</div>
    </div>
    <button class="guess-btn" onclick="lockGuess()">LOCK IN GUESS</button>
  </div>

  <div class="screen" id="screen-score">
    <div class="title-bar">
      <div class="game-title">〰 WAVELENGTH</div>
      <div class="round-info" id="round-info-score"></div>
    </div>
    <div class="phase-badge">RESULTS</div>
    <div class="score-visual" id="score-bar-visual">
      <div class="target-zone" id="target-zone-score"></div>
      <div class="dial-container" id="score-dial-container">
        <div class="dial">▲</div>
      </div>
    </div>
    <div class="score-result">
      <div class="score-pts" id="score-pts">0</div>
      <div class="score-pts-label" id="score-pts-label">points</div>
    </div>
    <div class="scoreboard">
      <div class="scoreboard-header"><span>PLAYER</span><span>SCORE</span></div>
      <div id="scoreboard-rows"></div>
    </div>
    <button class="next-round-btn" onclick="nextRound()">NEXT ROUND</button>
    <button class="new-game-btn" onclick="newGame()">New game</button>
  </div>

</div>
<script>
const SPECTRA=[["Cold","Hot"],["Quiet","Loud"],["Sad","Happy"],["Slow","Fast"],["Simple","Complex"],["Weak","Strong"],["Dark","Bright"],["Boring","Exciting"],["Old","New"],["Tiny","Huge"],["Safe","Dangerous"],["Ugly","Beautiful"],["Cheap","Expensive"],["Common","Rare"],["Short","Tall"],["Easy","Hard"],["Peaceful","Chaotic"],["Dull","Colorful"],["Thin","Thick"],["Soft","Hard"],["Near","Far"],["Empty","Full"],["Natural","Artificial"],["Humble","Arrogant"],["Private","Public"],["Serious","Funny"],["Healthy","Unhealthy"],["Calm","Angry"],["Predictable","Surprising"],["Realistic","Fantastical"]];
let state={players:[],scores:[],round:0,psychicIdx:0,currentSpectrum:null,targetPct:0,clue:'',guessPct:50,totalRounds:0};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let usedSpectra=[];
function pickSpectrum(){if(usedSpectra.length===0)usedSpectra=shuffle(SPECTRA);return usedSpectra.pop();}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');}
function addPlayer(){const c=document.getElementById('player-inputs');const n=c.children.length+1;if(n>6)return;const d=document.createElement('div');d.className='player-row';d.innerHTML=`<input type="text" value="Player ${n}" /><button class="remove-btn" onclick="removePlayer(this)">×</button>`;c.appendChild(d);}
function removePlayer(btn){const c=document.getElementById('player-inputs');if(c.children.length<=2)return;btn.parentElement.remove();}
function startGame(){const inputs=document.querySelectorAll('#player-inputs input');state.players=[...inputs].map((i,idx)=>i.value.trim()||`Player ${idx+1}`);state.scores=state.players.map(()=>0);state.round=0;state.psychicIdx=0;state.totalRounds=state.players.length*2;beginRound();}
function beginRound(){state.round++;state.currentSpectrum=pickSpectrum();state.targetPct=Math.round(15+Math.random()*70);state.guessPct=50;state.clue='';document.getElementById('round-info-psychic').textContent=`Round ${state.round}/${state.totalRounds}`;document.getElementById('psychic-name').textContent=`${state.players[state.psychicIdx]} is the Psychic`;document.getElementById('pole-left-psychic').textContent=state.currentSpectrum[0];document.getElementById('pole-right-psychic').textContent=state.currentSpectrum[1];document.getElementById('target-pct-display').textContent=`${state.targetPct}% toward "${state.currentSpectrum[1]}"`;document.getElementById('clue-input').value='';renderTargetZone('target-zone-psychic',state.targetPct,true);setPsychicDial(state.targetPct);document.getElementById('modal-psychic-name').textContent=state.players[state.psychicIdx];document.getElementById('psychic-modal').classList.add('active');show('psychic');}
function closeModal(){document.getElementById('psychic-modal').classList.remove('active');}
function renderTargetZone(id,pct,visible){const el=document.getElementById(id);const width=14;el.style.left=(pct-width/2)+'%';el.style.width=width+'%';el.style.opacity=visible?'1':'0';}
function setPsychicDial(pct){document.getElementById('psychic-dial-container').style.left=pct+'%';}
function giveClue(){const input=document.getElementById('clue-input');const clue=input.value.trim();if(!clue){input.focus();return;}state.clue=clue;document.getElementById('round-info-guess').textContent=`Round ${state.round}/${state.totalRounds}`;document.getElementById('clue-word-display').textContent=clue;document.getElementById('pole-left-guess').textContent=state.currentSpectrum[0];document.getElementById('pole-right-guess').textContent=state.currentSpectrum[1];const guesserNames=state.players.filter((_,i)=>i!==state.psychicIdx).join(', ');document.getElementById('guess-phase-label').textContent=`${guesserNames} — Place your guess`;document.getElementById('guess-dial-container').style.left='50%';state.guessPct=50;setupDrag('guess-bar','guess-dial-container',pct=>{state.guessPct=pct;});show('guess');}
function lockGuess(){const pts=calcPoints(state.guessPct,state.targetPct);state.scores[state.psychicIdx]+=pts;document.getElementById('round-info-score').textContent=`Round ${state.round}/${state.totalRounds}`;document.getElementById('score-pts').textContent=pts;document.getElementById('score-pts-label').textContent=pts>=4?'🎉 Bullseye!':pts>=3?'🔥 Close!':pts>=2?'👍 Good try':'😬 Miss';renderTargetZone('target-zone-score',state.targetPct,true);document.getElementById('score-dial-container').style.left=state.guessPct+'%';buildScoreboard();show('score');}
function calcPoints(guess,target){const diff=Math.abs(guess-target);if(diff<=4)return 4;if(diff<=8)return 3;if(diff<=14)return 2;return 0;}
function buildScoreboard(){const rows=document.getElementById('scoreboard-rows');const sorted=state.players.map((n,i)=>({name:n,score:state.scores[i],i})).sort((a,b)=>b.score-a.score);rows.innerHTML=sorted.map(p=>`<div class="scoreboard-row ${p.i===state.psychicIdx?'current':''}"><span class="player-name-sb">${p.i===state.psychicIdx?'★ ':''}${p.name}</span><span class="player-score-sb">${p.score}</span></div>`).join('');}
function nextRound(){if(state.round>=state.totalRounds){endGame();return;}state.psychicIdx=(state.psychicIdx+1)%state.players.length;beginRound();}
function endGame(){const winner=state.players.reduce((best,p,i)=>state.scores[i]>state.scores[best]?i:best,0);alert(`Game over! ${state.players[winner]} wins with ${state.scores[winner]} points!`);newGame();}
function newGame(){show('setup');}
function setupDrag(barId,dialId,callback){const bar=document.getElementById(barId);const dial=document.getElementById(dialId);let dragging=false;function getPct(e){const rect=bar.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;return Math.min(100,Math.max(0,x/rect.width*100));}function update(e){if(!dragging)return;e.preventDefault();const pct=getPct(e);dial.style.left=pct+'%';callback(Math.round(pct));}function stop(){dragging=false;}bar.addEventListener('mousedown',(e)=>{dragging=true;update(e);});bar.addEventListener('touchstart',(e)=>{dragging=true;update(e);},{passive:false});document.addEventListener('mousemove',update);document.addEventListener('touchmove',update,{passive:false});document.addEventListener('mouseup',stop);document.addEventListener('touchend',stop);}
</script>
</body>
</html>
